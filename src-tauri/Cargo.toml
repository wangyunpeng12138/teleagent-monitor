[package]
name = "teleagent-monitor"
version = "1.0.0"
description = "TeleAgent 任务状态悬浮窗监控"
authors = ["you"]
edition = "2021"

# Tauri 2 使用 src/main.rs 作为二进制入口

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = { version = "7", features = [] }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
